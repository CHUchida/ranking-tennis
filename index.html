<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hideki-Ranking Tênis</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <!-- Cabeçalho -->
        <header>
            <h1>🎾 GERENCIADOR DE RANKING - Tênis Amigos Anima</h1>
        </header>

        <!-- Conteúdo Principal -->
        <main>
            <!-- Sidebar: Formulário -->
            <aside class="sidebar">
                <h2>ADICIONAR / EDITAR</h2>
                
                <!-- Status de Edição -->
                <div id="status-edicao" class="status-edicao" style="display:none;">
                    <span id="label-edicao">✎ Editando: </span>
                    <button id="btn-cancelar-edicao" class="btn-cancelar">✕ CANCELAR</button>
                </div>

                <!-- Formulário -->
                <form id="form-jogador">
                    <div class="campo">
                        <label for="entry_nome">Nome:</label>
                        <input type="text" id="entry_nome" required>
                    </div>
                    <div class="campo">
                        <label for="entry_v">V:</label>
                        <input type="number" id="entry_v" min="0" value="0">
                    </div>
                    <div class="campo">
                        <label for="entry_d">D:</label>
                        <input type="number" id="entry_d" min="0" value="0">
                    </div>
                    <div class="campo">
                        <label for="entry_pontos">Pts:</label>
                        <input type="number" id="entry_pontos" min="0" value="0">
                    </div>
                    <div class="campo">
                        <label for="entry_aces">Aces:</label>
                        <input type="number" id="entry_aces" min="0" step="0.1" value="0">
                    </div>
                    <div class="campo">
                        <label for="entry_duplas">Duplas:</label>
                        <input type="number" id="entry_duplas" min="0" step="0.1" value="0">
                    </div>
                    <div class="campo">
                        <label for="entry_quebras">Quebras:</label>
                        <input type="number" id="entry_quebras" min="0" step="0.1" value="0">
                    </div>
                    <div class="campo">
                        <label for="entry_saque">%Saque:</label>
                        <input type="number" id="entry_saque" min="0" max="100" step="0.1" value="0">
                    </div>
                    <div class="campo">
                        <label for="entry_salvos">%Salvos:</label>
                        <input type="number" id="entry_salvos" min="0" max="100" step="0.1" value="0">
                    </div>

                    <button type="submit" id="btn-adicionar" class="btn-adicionar">+ ADICIONAR</button>
                    <button type="button" id="btn-limpar" class="btn-limpar">LIMPAR</button>
                </form>
            </aside>

            <!-- Tabela -->
            <section class="tabela-container">
                <div class="tabela-wrapper">
                    <table id="tabela-ranking">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Jogador</th>
                                <th>V</th>
                                <th>D</th>
                                <th>Pts</th>
                                <th>Aces</th>
                                <th>Dup</th>
                                <th>Qub</th>
                                <th>%Sq</th>
                                <th>%Sv</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela">
                            <!-- Dados inseridos via JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Barra de Botões -->
                <div class="barra-botoes">
                    <button id="btn-editar">Editar</button>
                    <button id="btn-remover" class="btn-danger">Remover</button>
                    <button id="btn-reordenar">Reordenar</button>
                    <button id="btn-stats">Stats</button>
                    <button id="btn-graficos">Gráficos</button>
                    <button id="btn-top3">Top 3</button>
                    <button id="btn-buscar">Buscar</button>
                    <button id="btn-exportar">Exportar CSV</button>
                    <button id="btn-salvar">Salvar</button>
                </div>

                <!-- Status -->
                <div id="status" class="status">Preencha os campos e clique em ADICIONAR</div>
            </section>
        </main>
    </div>

    <!-- Modal para Estatísticas -->
    <div id="modal-stats" class="modal">
        <div class="modal-conteudo">
            <span class="modal-fechar">&times;</span>
            <h2>ESTATÍSTICAS GERAIS</h2>
            <div id="stats-conteudo"></div>
        </div>
    </div>

    <!-- Modal para Gráficos -->
    <div id="modal-graficos" class="modal modal-grande">
        <div class="modal-conteudo">
            <span class="modal-fechar">&times;</span>
            <h2>DESEMPENHO DOS TENISTAS</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
                <canvas id="grafico-pontos" width="400" height="300"></canvas>
                <canvas id="grafico-vitorias" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <!-- Modal para Top 3 -->
    <div id="modal-top3" class="modal">
        <div class="modal-conteudo">
            <span class="modal-fechar">&times;</span>
            <h2>TOP 3 ATUAL</h2>
            <div id="top3-conteudo"></div>
        </div>
    </div>

    <!-- Modal para Busca -->
    <div id="modal-busca" class="modal">
        <div class="modal-conteudo">
            <span class="modal-fechar">&times;</span>
            <h2>BUSCAR JOGADOR</h2>
            <input type="text" id="input-busca" placeholder="Digite o nome...">
            <button id="btn-buscar-executar">Buscar</button>
            <div id="busca-resultados"></div>
        </div>
    </div>

    <script src="split.js"></script>
    <script src="script.js"></script>
</body>
</html>
